name: Publish To npm

on:
  release:
    types:
      - published

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -euo pipefail

          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          normalized_tag="${RELEASE_TAG#v}"

          echo "Package: ${package_name}"
          echo "Package version: ${package_version}"
          echo "Release tag: ${RELEASE_TAG}"

          if [ "${normalized_tag}" != "${package_version}" ]; then
            echo "::error title=Version mismatch::Release tag ${RELEASE_TAG} does not match package.json version ${package_version}."
            exit 1
          fi

          if [ "${IS_PRERELEASE}" = "true" ]; then
            echo "NPM_DIST_TAG=next" >> "$GITHUB_ENV"
          else
            echo "NPM_DIST_TAG=latest" >> "$GITHUB_ENV"
          fi

      - name: Build package
        run: |
          npm run verify:static
          npm run build
          npm publish --dry-run --ignore-scripts --access public --tag "$NPM_DIST_TAG"

      - name: Publish package
        env:
          IS_PRIVATE_REPO: ${{ github.event.repository.private }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ "$IS_PRIVATE_REPO" = "true" ]; then
            npm publish --ignore-scripts --access public --tag "$NPM_DIST_TAG"
          else
            npm publish --ignore-scripts --access public --provenance --tag "$NPM_DIST_TAG"
          fi
