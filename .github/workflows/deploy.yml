name: Deploy to upt-build-main

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag, or commit SHA to deploy'
        required: true
        default: 'main'
        type: string
      dry_run:
        description: 'Build and upload tarball, but skip container install'
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-upt-build-main
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and install UpRock node in n8n
    runs-on: [self-hosted, linux, x64, upt-build-main, n8n]
    timeout-minutes: 20
    env:
      PKG_NAME: '@uprock-ai/n8n-nodes-uprock'
      PKG_ARTIFACT_NAME: uprock-ai-n8n-nodes-uprock
      N8N_CONTAINER: n8n
      N8N_NODES_DIR: /home/node/.n8n/nodes
      N8N_EXEC_USER: node
      N8N_HEALTHZ: http://127.0.0.1:5678/healthz

    steps:
      - name: Show deploy inputs
        run: |
          echo "ref:     ${{ inputs.ref }}"
          echo "dry_run: ${{ inputs.dry_run }}"
          echo "runner:  $(hostname)"
          echo "actor:   ${{ github.actor }}"

      - name: Checkout ${{ inputs.ref }}
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Record deploy metadata
        id: meta
        run: |
          set -euo pipefail
          COMMIT=$(git rev-parse HEAD)
          SHORT=$(git rev-parse --short HEAD)
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "commit=$COMMIT"         >> "$GITHUB_OUTPUT"
          echo "short=$SHORT"           >> "$GITHUB_OUTPUT"
          echo "pkg_version=$PKG_VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT"
          echo "pkg_version=$PKG_VERSION"

      - name: Install dependencies (npm ci)
        run: npm ci --no-audit --no-fund

      - name: Build (npm run build)
        run: npm run build

      - name: Pack tarball (npm pack)
        id: pack
        run: |
          set -euo pipefail
          TGZ=$(npm pack --silent)
          if [ -z "$TGZ" ] || [ ! -f "$TGZ" ]; then
            echo "::error ::npm pack did not produce a tarball"
            exit 1
          fi
          echo "tarball=$TGZ"           >> "$GITHUB_OUTPUT"
          echo "tarball_abs=$PWD/$TGZ"  >> "$GITHUB_OUTPUT"
          echo "Packed: $TGZ ($(du -h "$TGZ" | cut -f1))"

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PKG_ARTIFACT_NAME }}-${{ steps.meta.outputs.pkg_version }}-${{ steps.meta.outputs.short }}
          path: ${{ steps.pack.outputs.tarball }}
          retention-days: 30
          if-no-files-found: error

      - name: Dry run — skipping container install
        if: ${{ inputs.dry_run }}
        run: echo "::notice ::Dry run requested. Tarball built and uploaded; container install skipped."

      - name: Preflight — docker socket + container state
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          if ! docker version >/dev/null 2>&1; then
            echo "::error ::Runner user cannot talk to the Docker socket. Add the runner OS user to the 'docker' group and restart the runner service."
            exit 1
          fi
          if [ "$(docker inspect -f '{{.State.Running}}' "$N8N_CONTAINER" 2>/dev/null)" != "true" ]; then
            echo "::error ::Container '$N8N_CONTAINER' is not running."
            docker ps -a --filter "name=^${N8N_CONTAINER}$" || true
            exit 1
          fi
          docker inspect --format 'Image={{.Config.Image}}  Started={{.State.StartedAt}}' "$N8N_CONTAINER"
          FLAG=$(docker exec "$N8N_CONTAINER" printenv N8N_COMMUNITY_PACKAGES_ENABLED 2>/dev/null || true)
          if [ "$FLAG" != "true" ]; then
            echo "::error ::N8N_COMMUNITY_PACKAGES_ENABLED is not 'true' inside the container (got: '$FLAG'). The installed node will not be loaded by n8n."
            exit 1
          fi

      - name: Copy tarball into container
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          TGZ='${{ steps.pack.outputs.tarball }}'
          TGZ_BASENAME=$(basename "$TGZ")
          docker cp "$TGZ" "$N8N_CONTAINER:/tmp/$TGZ_BASENAME"
          # docker cp always lands files as root; chown (as root, since container default user is node) so the -u node install step can unlink it under sticky /tmp
          docker exec -u root "$N8N_CONTAINER" chown "$N8N_EXEC_USER" "/tmp/$TGZ_BASENAME"
          docker exec "$N8N_CONTAINER" ls -l "/tmp/$TGZ_BASENAME"

      - name: Install tarball into $N8N_NODES_DIR
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          TGZ_BASENAME=$(basename '${{ steps.pack.outputs.tarball }}')
          docker exec -u "$N8N_EXEC_USER" \
            -e N8N_NODES_DIR="$N8N_NODES_DIR" \
            -e PKG_NAME="$PKG_NAME" \
            -e TGZ_BASENAME="$TGZ_BASENAME" \
            "$N8N_CONTAINER" sh -c '
              set -eu
              cd "$N8N_NODES_DIR"
              npm install --no-audit --no-fund --omit=dev "/tmp/$TGZ_BASENAME"
              rm -f "/tmp/$TGZ_BASENAME"
              ls -la "node_modules/$PKG_NAME" | head -5
            '

      - name: Restart n8n
        if: ${{ !inputs.dry_run }}
        run: docker restart "$N8N_CONTAINER"

      - name: Wait for /healthz
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -fsS --max-time 2 "$N8N_HEALTHZ" >/dev/null 2>&1; then
              echo "healthz OK after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error ::n8n did not report healthy on $N8N_HEALTHZ within 60s"
          docker logs --tail 80 "$N8N_CONTAINER" || true
          exit 1

      - name: Verify installed package loads inside container
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          docker exec -u "$N8N_EXEC_USER" -e PKG_NAME="$PKG_NAME" -e N8N_NODES_DIR="$N8N_NODES_DIR" \
            "$N8N_CONTAINER" node -e '
              const path = require("path");
              const base = path.join(process.env.N8N_NODES_DIR, "node_modules", process.env.PKG_NAME);
              const pkg = require(path.join(base, "package.json"));
              console.log("installed:", pkg.name, pkg.version);
              if (!pkg.n8n || !Array.isArray(pkg.n8n.nodes) || !Array.isArray(pkg.n8n.credentials)) {
                console.error("package.json missing n8n.nodes or n8n.credentials");
                process.exit(1);
              }
              for (const rel of [...pkg.n8n.nodes, ...pkg.n8n.credentials]) {
                const abs = path.join(base, rel);
                require(abs);
                console.log("loaded:", rel);
              }
              console.log("load:ok");
            '

      - name: Summary
        if: always()
        run: |
          {
            echo "### UpRock node deploy"
            echo ""
            echo "- **ref:**       \`${{ inputs.ref }}\`"
            echo "- **commit:**    \`${{ steps.meta.outputs.commit }}\`"
            echo "- **version:**   \`${{ steps.meta.outputs.pkg_version }}\`"
            echo "- **tarball:**   \`${{ steps.pack.outputs.tarball }}\`"
            echo "- **dry_run:**   \`${{ inputs.dry_run }}\`"
            echo "- **host:**      \`upt-build-main\`"
            echo "- **container:** \`${{ env.N8N_CONTAINER }}\`"
            echo "- **status:**    \`${{ job.status }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
